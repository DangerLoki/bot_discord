name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependências (dev)
        run: uv sync --group dev

      - name: Rodar ruff
        run: uv run ruff check .

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependências (dev)
        run: uv sync --group dev

      - name: Rodar testes com cobertura
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build binário (smoke test)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependências
        run: uv pip install --system -r requirements.txt pyinstaller

      - name: Build binário Linux
        run: pyinstaller bot-discord-linux.spec

      - name: Verificar binário gerado
        run: test -f dist/bot-discord-linux
